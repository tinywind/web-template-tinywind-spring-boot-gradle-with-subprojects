server:
  port: 20001
  servlet:
    session:
      timeout: 10h
spring:
  application:
    name: front
  messages:
    basename: classpath:messages
    encoding: UTF-8
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp
  devtools:
    livereload:
      enabled: false
    restart:
      enabled: false
  servlet:
    multipart:
      file-size-threshold: 1MB
      max-request-size: 100MB
      max-file-size: 100MB
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
management:
  metrics:
    tags:
      application: ${spring.application.name}-metrics
  endpoints:
    web:
      exposure:
        include: "health, info, prometheus"
# spring-error-notifier 설정
application:
  log:
    level: ERROR
    service: ${spring.application.name}
    endpoint_url: http://localhost:8082/endpoint
# 정의 설정
springdoc:
  api-docs:
    enabled: ${user-data.application.debugging}
  swagger-ui:
    enabled: ${user-data.application.debugging}
    path: /swagger-ui.html
user-data:
  mail:
    from:
  application:
    version: 0.1
    debugging: true
    swagger:
      api-package: org.tinywind.server.controller.api
    file:
      location: ./files
  datasource:
    #    jdbc-url: jdbc:oracle:thin:@localhost:1521:orcl
    jdbc-url: ${JDBC_URL}
    #    driver-class-name: oracle.jdbc.OracleDriver
    driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
    username: ${JDBC_USERNAME}
    password: ${JDBC_PASSWORD}
# 두번째 datasource가 적용되는지 확인
    secondary:
      jdbc-url: ${SECONDARY_JDBC_URL}
      driver-class-name: ${user-data.datasource.driver-class-name}
      username: ${SECONDARY_JDBC_USERNAME}
      password: ${SECONDARY_JDBC_PASSWORD}