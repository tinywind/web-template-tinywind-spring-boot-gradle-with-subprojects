buildscript {
    configurations.classpath {
        resolutionStrategy.force 'org.apache.commons:commons-lang3:3.21.0'
    }
}

plugins {
    id 'org.springframework.boot' version '4.1.2' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'io.freefair.lombok' version '9.8.2' apply false
}

allprojects {
    group = 'kr.co.klnet'
    version = '0.1-SNAPSHOT'
    layout.buildDirectory = rootProject.layout.projectDirectory.dir('.tmp/build/' + project.name)
    repositories { mavenCentral() }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.freefair.lombok'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
    lombok { version = '1.18.48' }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs.add('-parameters')
    }
    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        maxHeapSize = '512m'
        maxParallelForks = 1
        systemProperty 'java.io.tmpdir', rootProject.file('.tmp/test-temp').absolutePath
        doFirst { rootProject.file('.tmp/test-temp').mkdirs() }
    }
    dependencies {
        annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        implementation 'org.jetbrains.kotlin:kotlin-reflect'
        implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8'
        implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core'
        implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-jdk8'
        implementation 'org.slf4j:slf4j-api'
        implementation 'ch.qos.logback:logback-classic'
        implementation 'org.apache.commons:commons-lang3:3.21.0'
    }
}

project(':meta') {
    bootJar { enabled = false }
    jar { enabled = true }
    dependencies {
        api 'com.oracle.database.jdbc:ojdbc17:23.26.3.0.0'
    }
}

configure([project(':common-spring'), project(':spring-error-notifier')]) {
    bootJar { enabled = false }
    jar { enabled = true }
    dependencies {
        implementation 'net.rakugakibox.util:yaml-resource-bundle:1.1'
        api 'org.springframework:spring-webmvc'
        implementation 'org.springframework.boot:spring-boot'
        implementation 'org.springframework.boot:spring-boot-web-server'
        implementation 'org.springframework.boot:spring-boot-actuator-autoconfigure'
        api 'com.fasterxml.jackson.core:jackson-databind'
        implementation 'eu.bitwalker:UserAgentUtils:1.21'
        implementation 'com.squareup.okhttp3:okhttp:5.3.2'
        compileOnly 'jakarta.servlet:jakarta.servlet-api'
    }
}

project(':common-spring') {
    dependencies {
        api 'io.vavr:vavr:0.10.7'
        api 'io.vavr:vavr-jackson:0.10.3'
    }
}

project(':webapp') {
    apply plugin: 'war'
    dependencies {
        implementation project(':meta')
        implementation project(':common-spring')
        implementation project(':spring-error-notifier')
        implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.1.0'
        implementation 'org.mybatis:mybatis:3.6.0'
        implementation 'org.springframework.boot:spring-boot-starter-jdbc'
        implementation 'org.springframework.boot:spring-boot-starter-aspectj'
        implementation 'org.springframework.boot:spring-boot-starter-validation'
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        implementation 'io.micrometer:micrometer-registry-prometheus'
        implementation 'org.springframework.boot:spring-boot-starter-mail'
        implementation 'org.thymeleaf:thymeleaf:3.1.5.RELEASE'
        implementation 'org.springframework.boot:spring-boot-starter-webmvc'
        implementation 'org.springframework.boot:spring-boot-jackson2'
        implementation 'org.apache.tomcat.embed:tomcat-embed-jasper'
        implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api'
        implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl'
        implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'
        implementation 'io.swagger:swagger-annotations:1.6.16'
        implementation 'org.apache.httpcomponents:httpcore:4.4.16'
        implementation 'org.apache.httpcomponents:httpclient:4.5.14'
        implementation 'org.apache.httpcomponents.client5:httpclient5'
        implementation 'org.mindrot:jbcrypt:0.4'
        implementation 'commons-fileupload:commons-fileupload:1.6.0'
        implementation 'commons-io:commons-io:2.22.0'
        implementation 'org.apache.poi:poi:5.5.1'
        implementation 'org.apache.poi:poi-ooxml:5.5.1'
        implementation 'org.webjars:jquery:3.7.1'
        implementation 'org.webjars:jquery-blockui:2.70-1'
        implementation 'org.webjars:momentjs:2.31.0'
        implementation 'org.webjars:d3js:5.16.0'
        implementation 'org.webjars.bower:less.js:2.7.3'
        implementation 'org.webjars:jquery-ui:1.14.2'
        implementation 'org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4.1:1.16'
        testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
        testRuntimeOnly 'com.h2database:h2'
        testImplementation 'com.icegreen:greenmail:2.1.15'
    }
}
